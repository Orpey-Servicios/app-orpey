[project]
name = "orpey-backend"
version = "0.2.0"
description = "Backend API para Orpey Servicios - Sistema de Gestión de Servicio Técnico"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",          # Framework web moderno y rápido
    "uvicorn[standard]>=0.32.0", # Servidor para ejecutar FastAPI
    "sqlalchemy>=2.0.0",         # ORM para interactuar con la base de datos
    "asyncpg>=0.30.0",           # Driver asíncrono para PostgreSQL
    "pydantic>=2.0.0",           # Validación de datos
    "pydantic-settings>=2.0.0",  # Manejo de variables de entorno
    "alembic>=1.13.0",           # Migraciones de base de datos
    "python-dotenv>=1.0.0",      # Cargar variables de entorno desde .env
    "psycopg2-binary>=2.9.0",    # Driver alternativo para PostgreSQL
    "reportlab>=4.0.0",          # Generación de PDFs
    "python-jose[cryptography]>=3.3.0",  # JWT para autenticación
    "passlib[bcrypt]>=1.7.4",    # Hashing de contraseñas
    "python-multipart>=0.0.6",   # Soporte para formularios
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",             # Framework de testing
    "pytest-asyncio>=0.24.0",    # Testing de código asíncrono
    "httpx>=0.27.0",             # Cliente HTTP para tests
]

[tool.setuptools.packages.find]
where = ["src"]
